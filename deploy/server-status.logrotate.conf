# Rotacion del log del bot. Se instala en /etc/logrotate.d/server-status
#
# Va en su propio fichero en vez de en la lista compartida de
# /etc/logrotate.d/void, para no tocar la configuracion de los demas servicios.
# Las opciones son las mismas que usa esa lista.
/var/log/server-status.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root adm
}
